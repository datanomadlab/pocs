nota = "Modelo, no una factura: precios por demanda de us-east-1 y supuestos en escenario.toml. Flink: administrado, una aplicación por consumidor. Propio: un consumidor escrito a mano. SQS FIFO: con SNS FIFO repartiendo a 3 colas; empaquetado lleva 10 eventos por mensaje y pide consumidor propio. MSK: Kafka administrado. Redpanda y NATS: 3 nodos propios. Incluye transporte, transferencia entre zonas y el cómputo de la entrega para 3 consumidores. La línea base lleva además la pieza que habla WebSocket. No incluye el disco de los brokers propios, Redis para Centrifugo, la salida a internet hacia las pantallas, el balanceador ni horas de personas. Flink no se midió: su costo supone 1 MB por segundo por KPU. A 100.000 eventos por segundo, las aplicaciones de Flink cuestan USD 7.918; USD 15.595 si una KPU rinde la mitad y USD 4.079 si rinde el doble."

