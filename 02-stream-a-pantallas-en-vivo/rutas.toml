etiqueta = "medido"

# Centrifugo guardando el historial de los canales en Redis en vez de en su propia memoria: al
# reiniciarse, las pantallas pueden pedirle lo que se perdieron.
[[ruta]]
id = "nats-centrifugo-redis"
corto = "NATS + Centrifugo/Redis"
transporte = "nats"
entrega = "centrifugo-redis"
nombre = "NATS + Centrifugo con Redis"
etiqueta = "medido"

[[ruta]]
id = "kinesis-go"
corto = "Kinesis + Go"
transporte = "kinesis"
entrega = "go"
nombre = "Kinesis + consumidor en Go"
etiqueta = "simulado"
# El emulador de Kinesis se pone lento a medida que acumula registros. Con más carga que esta, la
# prueba mide al emulador y no a la ruta.
tasa = 200

